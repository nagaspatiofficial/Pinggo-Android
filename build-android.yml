name: Build PINGGO Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PINGGO project
        run: |
          rm -rf pinggo-build
          mkdir pinggo-build
          unzip -q "PINGGO-Android-versionCode-2.zip" -d pinggo-build
          PROJECT_DIR=$(find pinggo-build -type f -path "*/app/build.gradle" -printf '%h
' | sed 's#/app$##' | head -1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Decode PINGGO upload key
        env:
          PINGGO_KEYSTORE_BASE64: ${{ secrets.PINGGO_KEYSTORE_BASE64 }}
        run: |
          test -n "$PINGGO_KEYSTORE_BASE64"
          printf '%s' "$PINGGO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinggo-upload.jks"

      - name: Build signed Android App Bundle
        env:
          PINGGO_KEYSTORE_PATH: ${{ runner.temp }}/pinggo-upload.jks
          PINGGO_STORE_PASSWORD: ${{ secrets.PINGGO_STORE_PASSWORD }}
          PINGGO_KEY_ALIAS: ${{ secrets.PINGGO_KEY_ALIAS }}
          PINGGO_KEY_PASSWORD: ${{ secrets.PINGGO_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed PINGGO AAB
        uses: actions/upload-artifact@v4
        with:
          name: PINGGO-PlayStore-AAB-versionCode-2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
