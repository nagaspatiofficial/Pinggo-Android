name: Build PINGGO Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PINGGO project
        run: |
          mkdir pinggo-build
          unzip "Pinggo android github.zip" -d pinggo-build
          echo "PROJECT_DIR=$(find pinggo-build -name settings.gradle -printf '%h\n' | head -1)" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build Android App Bundle
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PINGGO-release-AAB
          path: pinggo-build/**/app/build/outputs/bundle/release/*.aab
